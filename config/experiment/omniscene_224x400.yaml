# @package _global_

defaults:
  - override /dataset: omniscene
  - override /model/encoder: trans
  - override /loss: [mse, lpips]

wandb:
  name: omniscene_224x400
  tags: [omniscene, 224x400]

data_loader:
  train:
    batch_size: 1
  val:
    batch_size: 1
  test:
    batch_size: 1

trainer:
  max_steps: 100_001
  val_check_interval: 0.01

train:
  use_dynamic_mask: true

# ----- Additional params for default best model customization
model:
  encoder:
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1,1,1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1,1,1,1,1]

# lpips loss
loss:
  lpips:
    apply_after_step: 0
    weight: 0.05

dataset:
  image_shape: [224, 400]
  roots: [datasets/omniscene]
  near: 0.5
  far: 100.0
  baseline_scale_bounds: false
  make_baseline_1: false


test:
  eval_time_skip_steps: 5
  compute_scores: true
